name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (skip tests)
        run: mvn --batch-mode clean compile -DskipTests

      - name: Run unit tests
        run: mvn --batch-mode test
        continue-on-error: true   # tests require a running H2/SMTP stack; failures are reported but don't block CI

      - name: Package WAR
        run: mvn --batch-mode package -DskipTests

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluebox-war
          path: target/bluebox.war
          retention-days: 14

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package WAR for Docker
        run: mvn --batch-mode package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: target
          file: target/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bluebox:latest
            ghcr.io/${{ github.repository_owner }}/bluebox:${{ github.sha }}
